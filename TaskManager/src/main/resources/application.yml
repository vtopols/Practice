spring:
  application:
    name: TaskManager
  datasource:
    url: jdbc:postgresql://localhost:5432/tasks_db
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080